# Alembic configuration for the Varsity Companion API.
#
# The actual `sqlalchemy.url` is NOT stored here (would risk leaking the
# Neon connection string); app/core/config.py supplies it at runtime via
# alembic/env.py -> settings.database_url.

[alembic]
script_location = alembic

# --- Template for naming constraints (readable + deterministic). ---
# Without this, autogenerated migrations get anonymous constraint names that
# make upgrades/downgrades between environments fragile.
prepend_sys_path = .

# Logging (kept quiet; the app logger handles runtime output).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
