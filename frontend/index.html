<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
    <!--
      PWA tags. Placed AFTER the figma:head-end marker on purpose: everything
      between figma:head-start and figma:head-end is rewritten from
      .figma/make/site.json by the figmaSiteConfiguration plugin on every build,
      so tags inside that region are discarded.
    -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#1C1814">

    <!--
      iOS does not read the web manifest for the home-screen experience, so
      these are still required for "Add to Home Screen" to launch full-screen
      with the right status bar and label.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Varsity">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <meta name="mobile-web-app-capable" content="yes">
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
