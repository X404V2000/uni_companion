<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Varsity Companion</title>
  <!--
    Colours match --color-bg / --color-fg / --color-fg-muted in src/index.css.
    This file is served by the service worker when a navigation fails, so it is
    the first thing the user sees after losing connection - a cream page here
    would look like a different app.
    Kept inline and dependency-free: it must render with no network, no bundle
    and no font download.
  -->
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1C1814;
      color: #EDE8E0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
    p  { color: #9C9488; font-size: 14px; max-width: 360px; margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Varsity Companion is showing cached content. Reconnect to sync new summaries and materials.</p>
  </main>
</body>
</html>
