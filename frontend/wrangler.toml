# ============================================================================
# Cloudflare Workers configuration.
#
# NOTE: `name` must match the Worker Cloudflare creates from the project,
# otherwise its CI overrides the value and offers to open a pull request
# correcting this file. Cloudflare named it after the repository.
#
# WHY THIS EXISTS
# ---------------
# Cloudflare's current dashboard creates new projects as Workers rather than
# Pages, and the Workers flow expects a `wrangler.toml`. Without one, the deploy
# command (`npx wrangler deploy`) has nothing to build against and fails.
#
# WHY "assets" AND NOT A SCRIPT
# -----------------------------
# This frontend is a pure static single-page application: `vite build` emits
# HTML, CSS and JS, and there is no server-side code. Cloudflare's static asset
# hosting serves that directly, so `[assets]` is the whole configuration - there
# is no Worker script to run and no runtime to pay for.
#
# `not_found_handling = "single-page-application"` is what makes deep links work.
# Every screen is served by the same index.html and React decides what to render,
# but a static host cannot know that, so a request for a path that is not on disk
# would otherwise return its own 404. This replaces the equivalent `_redirects`
# file, which Pages reads but the Workers assets flow does not.
# ============================================================================

name = "uni-companion"
compatibility_date = "2026-09-30"

# ⚠️ WHERE THE BUILD HAPPENS - this is why deployments were failing.
#
# Cloudflare's GitHub build starts at the REPOSITORY ROOT, where there is no
# package.json (the app lives in frontend/). With no build command, nothing
# produced ./dist, so every deployment failed in 0 seconds with nothing to
# upload - on every branch, including main. The logs are empty because the build
# never started, not because the build broke.
#
# `build` makes the build step explicit so it does not depend on a dashboard
# setting that can drift or be lost. `cwd` moves it to the directory that
# actually has the package.
[build]
command = "npm ci && npm run build"
cwd = "."

# Directory produced by `npm run build`, relative to this file.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
